<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #1f2937;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .ai {
      background: #374151;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #1f2937;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <header>🤖 My Personal AI</header>

  <div id="chat">
    <div class="message ai">
      Hello! I'm your personal AI. 👋
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
    >
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "Your AI connection isn't set up yet. We'll connect the AI in the next steps. 🤖";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("messageInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
